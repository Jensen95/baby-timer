name: Cleanup screenshot branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete screenshots branch
        uses: actions/github-script@v7
        with:
          script: |
            const raw = context.payload.pull_request.head.ref;
            const branch = 'screenshots/' + raw.replace(/\//g, '-');
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/' + branch
              });
              core.info(`Deleted ${branch}`);
            } catch (e) {
              if (e.status === 422 || e.status === 404) {
                core.info(`${branch} not found — nothing to delete`);
              } else {
                throw e;
              }
            }
