name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_BUGSINK_DSN: ${{ secrets.PUBLIC_BUGSINK_DSN }}
          BASE_PATH: /baby-timer
          BUGSINK_URL: ${{ secrets.BUGSINK_URL }}
          BUGSINK_AUTH_TOKEN: ${{ secrets.BUGSINK_AUTH_TOKEN }}
          BUGSINK_ORG: ${{ secrets.BUGSINK_ORG }}
          BUGSINK_PROJECT: ${{ secrets.BUGSINK_PROJECT }}

      - name: Remove leftover sourcemaps from artifact
        # Belt-and-suspenders: the Vite plugin deletes maps after a successful
        # upload, but this step ensures no .map files reach the Pages artifact
        # if the upload fails or is skipped (no BUGSINK_AUTH_TOKEN).
        run: find build -name '*.js.map' -delete 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
