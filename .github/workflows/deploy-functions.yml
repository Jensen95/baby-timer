# Deploy Supabase Edge Functions
# Requires secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF to be configured in repo settings.
# This workflow complements the manual `supabase functions deploy` fallback.

name: Deploy Edge Functions

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
