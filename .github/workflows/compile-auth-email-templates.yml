name: Compile auth email templates

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'claude/*'
    paths:
      - 'supabase/auth-email-templates.mjml.md'
      - '.github/workflows/compile-auth-email-templates.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/auth-email-templates.mjml.md'
      - '.github/workflows/compile-auth-email-templates.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and publish auth templates
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const https = require('node:https');
          const { spawnSync } = require('node:child_process');

          const sourcePath = path.resolve('supabase/auth-email-templates.mjml.md');
          const compiledPath = path.resolve('supabase/auth-email-templates.compiled.md');

          const templateSpecs = {
            'Magic Link / Sign-in': {
              subject: 'Your sign-in link',
              subjectKey: 'mailer_subjects_magic_link',
              templateKey: 'mailer_templates_magic_link_content'
            },
            Invite: {
              subject: 'You have been invited',
              subjectKey: 'mailer_subjects_invite',
              templateKey: 'mailer_templates_invite_content'
            },
            Confirmation: {
              subject: 'Confirm your signup',
              subjectKey: 'mailer_subjects_confirmation',
              templateKey: 'mailer_templates_confirmation_content'
            },
            'Password reset': {
              subject: 'Reset your password',
              subjectKey: 'mailer_subjects_recovery',
              templateKey: 'mailer_templates_recovery_content'
            },
            'Email change': {
              subject: 'Confirm email change',
              subjectKey: 'mailer_subjects_email_change',
              templateKey: 'mailer_templates_email_change_content'
            }
          };

          function extractTemplates(markdown) {
            const sectionRegex = /^##\s+(.+)$/gm;
            const matches = [...markdown.matchAll(sectionRegex)];
            const templates = [];

            for (let i = 0; i < matches.length; i += 1) {
              const current = matches[i];
              const next = matches[i + 1];
              const sectionStart = current.index;
              const sectionEnd = next ? next.index : markdown.length;
              const sectionText = markdown.slice(sectionStart, sectionEnd);
              const mjmlMatch = sectionText.match(/```mjml\n([\s\S]*?)\n```/);
              if (mjmlMatch) {
                templates.push({ title: current[1].trim(), mjml: mjmlMatch[1].trim() });
              }
            }

            return templates;
          }

          function compileMjml(mjmlSource, tempDir) {
            const inputPath = path.join(tempDir, 'template.mjml');
            const outputPath = path.join(tempDir, 'template.html');
            fs.writeFileSync(inputPath, mjmlSource, 'utf8');

            const result = spawnSync(
              'npx',
              ['mjml', inputPath, '-o', outputPath, '--config.validationLevel', 'soft'],
              { encoding: 'utf8' }
            );

            if (result.status !== 0) {
              throw new Error((result.stderr || result.stdout || 'MJML compilation failed').trim());
            }

            return fs.readFileSync(outputPath, 'utf8').trim();
          }

          function patchSupabaseAuthConfig(projectRef, accessToken, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const request = https.request(
                {
                  hostname: 'api.supabase.com',
                  path: `/v1/projects/${projectRef}/config/auth`,
                  method: 'PATCH',
                  headers: {
                    Authorization: `Bearer ${accessToken}`,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body)
                  }
                },
                (response) => {
                  let responseBody = '';
                  response.on('data', (chunk) => {
                    responseBody += chunk;
                  });
                  response.on('end', () => {
                    if (response.statusCode >= 200 && response.statusCode < 300) {
                      resolve(response.statusCode);
                      return;
                    }
                    reject(
                      new Error(
                        `Supabase API request failed (${response.statusCode}): ${responseBody}`
                      )
                    );
                  });
                }
              );

              request.on('error', reject);
              request.write(body);
              request.end();
            });
          }

          async function main() {
            const source = fs.readFileSync(sourcePath, 'utf8');
            const templates = extractTemplates(source);
            if (templates.length === 0) {
              throw new Error(`No MJML templates found in ${sourcePath}`);
            }

            const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'baby-timer-mjml-'));

            try {
              const compiledBlocks = [];
              for (const { title, mjml } of templates) {
                const spec = templateSpecs[title];
                if (!spec) {
                  throw new Error(`No Supabase mapping configured for template section: ${title}`);
                }
                const html = compileMjml(mjml, tempDir);
                compiledBlocks.push({ title, spec, html });
              }

              const outputLines = [
                '# Supabase Auth Email Templates (compiled HTML)',
                '',
                'This file is generated from `supabase/auth-email-templates.mjml.md`.',
                'Paste each HTML block into the matching Supabase Auth template setting.',
                ''
              ];

              const payload = {};

              for (const block of compiledBlocks) {
                outputLines.push(`## ${block.title}`);
                outputLines.push('');
                outputLines.push('```html');
                outputLines.push(block.html);
                outputLines.push('```');
                outputLines.push('');

                payload[block.spec.subjectKey] = block.spec.subject;
                payload[block.spec.templateKey] = block.html;
              }

              outputLines.push('## Notes');
              outputLines.push('');
              outputLines.push('- Regenerate this file after editing the MJML source file.');
              outputLines.push('- Supabase Auth stores the pasted HTML and renders it at runtime.');
              outputLines.push('');

              fs.writeFileSync(compiledPath, `${outputLines.join('\n')}`, 'utf8');
              console.log(`Wrote ${compiledPath}`);

              if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
                const projectRef = process.env.SUPABASE_PROJECT_REF;
                const accessToken = process.env.SUPABASE_ACCESS_TOKEN;

                if (!projectRef || !accessToken) {
                  throw new Error(
                    'SUPABASE_PROJECT_REF and SUPABASE_ACCESS_TOKEN are required to publish auth templates'
                  );
                }

                const statusCode = await patchSupabaseAuthConfig(projectRef, accessToken, payload);
                console.log(`Published auth templates: HTTP ${statusCode}`);
              }
            } finally {
              fs.rmSync(tempDir, { recursive: true, force: true });
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
