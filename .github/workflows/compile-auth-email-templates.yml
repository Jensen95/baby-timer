name: Compile auth email templates

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'claude/*'
    paths:
      - 'supabase/auth-email-templates.mjml.md'
      - 'scripts/compile-auth-email-templates.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/auth-email-templates.mjml.md'
      - 'scripts/compile-auth-email-templates.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile auth templates
        run: npm run compile:auth-email-templates
