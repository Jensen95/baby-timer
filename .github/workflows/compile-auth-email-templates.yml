name: Compile auth email templates

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'claude/*'
    paths:
      - 'supabase/templates/auth/*.mjml'
      - '.github/workflows/compile-auth-email-templates.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/templates/auth/*.mjml'
      - '.github/workflows/compile-auth-email-templates.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and publish auth templates
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          TEMPLATE_DIR="supabase/templates/auth"
          OUTPUT_DIR="supabase/templates/auth/html"

          if [ ! -d "$TEMPLATE_DIR" ]; then
            echo "Skipping auth template compile: missing directory $TEMPLATE_DIR"
            exit 0
          fi

          mkdir -p "$OUTPUT_DIR"

          npx mjml "$TEMPLATE_DIR/magic_link.mjml" -o "$OUTPUT_DIR/magic_link.html" --config.validationLevel soft
          npx mjml "$TEMPLATE_DIR/invite.mjml" -o "$OUTPUT_DIR/invite.html" --config.validationLevel soft
          npx mjml "$TEMPLATE_DIR/confirmation.mjml" -o "$OUTPUT_DIR/confirmation.html" --config.validationLevel soft
          npx mjml "$TEMPLATE_DIR/recovery.mjml" -o "$OUTPUT_DIR/recovery.html" --config.validationLevel soft
          npx mjml "$TEMPLATE_DIR/email_change.mjml" -o "$OUTPUT_DIR/email_change.html" --config.validationLevel soft

          echo "Compiled auth templates to $OUTPUT_DIR"

          should_publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            should_publish=true
          fi

          if [ "$should_publish" != "true" ]; then
            echo "Skipping publish for event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
            exit 0
          fi

          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_PROJECT_REF and SUPABASE_ACCESS_TOKEN are required to publish auth templates"
            exit 1
          fi

          payload=$(jq -n \
            --arg subj_magic "Your sign-in link" \
            --rawfile tmpl_magic "$OUTPUT_DIR/magic_link.html" \
            --arg subj_invite "You have been invited" \
            --rawfile tmpl_invite "$OUTPUT_DIR/invite.html" \
            --arg subj_confirmation "Confirm your signup" \
            --rawfile tmpl_confirmation "$OUTPUT_DIR/confirmation.html" \
            --arg subj_recovery "Reset your password" \
            --rawfile tmpl_recovery "$OUTPUT_DIR/recovery.html" \
            --arg subj_email_change "Confirm email change" \
            --rawfile tmpl_email_change "$OUTPUT_DIR/email_change.html" \
            '{
              mailer_subjects_magic_link: $subj_magic,
              mailer_templates_magic_link_content: $tmpl_magic,
              mailer_subjects_invite: $subj_invite,
              mailer_templates_invite_content: $tmpl_invite,
              mailer_subjects_confirmation: $subj_confirmation,
              mailer_templates_confirmation_content: $tmpl_confirmation,
              mailer_subjects_recovery: $subj_recovery,
              mailer_templates_recovery_content: $tmpl_recovery,
              mailer_subjects_email_change: $subj_email_change,
              mailer_templates_email_change_content: $tmpl_email_change
            }')

          curl --fail --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload"

          echo "Published auth templates to Supabase"
