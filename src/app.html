<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<script>
			(function () {
				var isLocalhost =
					window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

				// Clean up stale SW/caches from older builds on localhost to avoid serving outdated dev shells.
				if (isLocalhost && 'serviceWorker' in navigator) {
					navigator.serviceWorker.getRegistrations().then(function (registrations) {
						registrations.forEach(function (registration) {
							registration.unregister();
						});
					});

					if ('caches' in window) {
						caches.keys().then(function (keys) {
							keys.forEach(function (key) {
								caches.delete(key);
							});
						});
					}
				}

				var stored = localStorage.getItem('baby-tracker:theme');
				var valid = ['light', 'dark', 'night', 'grey'];
				var theme =
					valid.indexOf(stored) !== -1
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="%sveltekit.assets%/icons/pwa-192x192.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"
			href="%sveltekit.assets%/icons/pwa-512x512.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f8a5c2" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Baby Timer" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icons/pwa-192x192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
