<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<script>
			(function () {
				var stored = localStorage.getItem('baby-tracker:theme');
				var valid = ['light', 'dark', 'night', 'grey'];
				var theme =
					valid.indexOf(stored) !== -1
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f8a5c2" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Baby Timer" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/pwa-192x192.png" />
		%sveltekit.head%
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					const basePath = '%sveltekit.assets%';
					const swBase = basePath ? `${basePath}/` : '/';
					navigator.serviceWorker.register(`${swBase}sw.js`, { scope: swBase });
				});
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
